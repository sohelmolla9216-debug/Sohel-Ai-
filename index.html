
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohel AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <div class="bg-indigo-600 text-white p-2 rounded-lg">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h1 class="font-bold text-base text-indigo-400">Sohel AI Studio</h1>
        </div>
        <div class="flex items-center space-x-2">
            <div class="bg-gray-800 px-3 py-1 rounded-full flex items-center space-x-1 border border-yellow-500/30 text-xs">
                <i class="fa-solid fa-coins text-yellow-400"></i>
                <span id="coin-count" class="font-bold text-yellow-300">1250</span>
            </div>
            <button onclick="claimBonus()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-950 font-bold px-2.5 py-1 rounded text-xs transition">
                +50 Coins
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-lg w-full mx-auto p-4 pb-20 space-y-4">

        <!-- Tab 1: Chat -->
        <section id="tab-chat" class="tab-content space-y-3">
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-3 shadow flex flex-col h-[65vh]">
                <h2 class="font-bold text-sm text-indigo-300 mb-2"><i class="fa-solid fa-robot mr-1"></i> AI Assistant</h2>
                <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs bg-gray-950 p-3 rounded-lg border border-gray-800">
                    <div class="bg-gray-900 p-2 rounded border border-gray-800">
                        <p class="text-indigo-400 font-bold">Sohel AI</p>
                        <p class="text-gray-300">Hello! Type anything below to test the chat response.</p>
                    </div>
                </div>
                <div class="pt-2 flex space-x-2 mt-2">
                    <input type="text" id="user-input" placeholder="Type a message..." class="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 text-gray-100">
                    <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 px-3 py-2 rounded-lg text-white font-bold text-xs"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </section>

        <!-- Tab 2: Tools / Quick Actions -->
        <section id="tab-tools" class="tab-content space-y-3 hidden">
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow space-y-3">
                <h2 class="font-bold text-sm text-purple-300"><i class="fa-solid fa-toolbox mr-1"></i> Quick Utility Tools</h2>
                <button onclick="runTool('text')" class="w-full bg-gray-800 hover:bg-gray-700 p-3 rounded-lg text-left text-xs border border-gray-700 flex justify-between items-center transition">
                    <span><i class="fa-solid fa-file-lines text-indigo-400 mr-2"></i> Text Summary Generator</span>
                    <i class="fa-solid fa-chevron-right text-gray-500"></i>
                </button>
                <button onclick="runTool('code')" class="w-full bg-gray-800 hover:bg-gray-700 p-3 rounded-lg text-left text-xs border border-gray-700 flex justify-between items-center transition">
                    <span><i class="fa-solid fa-code text-emerald-400 mr-2"></i> Clean HTML/JS Snippet</span>
                    <i class="fa-solid fa-chevron-right text-gray-500"></i>
                </button>
                <div id="tool-output" class="bg-gray-950 p-3 rounded-lg border border-gray-800 text-xs text-gray-300 hidden">
                    <p class="font-bold text-indigo-400 mb-1">Result Output:</p>
                    <p id="tool-result-text"></p>
                </div>
            </div>
        </section>

        <!-- Tab 3: Profile -->
        <section id="tab-profile" class="tab-content space-y-3 hidden">
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow space-y-3 text-xs">
                <h2 class="font-bold text-sm text-amber-300"><i class="fa-solid fa-user mr-1"></i> User Profile</h2>
                <p><strong>Name:</strong> Sohel Molla</p>
                <p><strong>Status:</strong> Active Developer</p>
                <p><strong>Coins:</strong> <span id="profile-coins" class="text-yellow-400 font-bold">1250</span></p>
                <button onclick="resetAccount()" class="w-full bg-red-900/30 text-red-400 border border-red-800/50 py-2 rounded-lg font-semibold">Reset Data</button>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-gray-900 border-t border-gray-800 fixed bottom-0 left-0 right-0 py-2 px-6 flex justify-around items-center z-50">
        <button onclick="switchTab('chat', this)" id="nav-chat" class="nav-btn flex flex-col items-center text-indigo-400">
            <i class="fa-solid fa-comments text-base"></i>
            <span class="text-[10px] mt-0.5">Chat</span>
        </button>
        <button onclick="switchTab('tools', this)" id="nav-tools" class="nav-btn flex flex-col items-center text-gray-400 hover:text-gray-200">
            <i class="fa-solid fa-toolbox text-base"></i>
            <span class="text-[10px] mt-0.5">Tools</span>
        </button>
        <button onclick="switchTab('profile', this)" id="nav-profile" class="nav-btn flex flex-col items-center text-gray-400 hover:text-gray-200">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[10px] mt-0.5">Profile</span>
        </button>
    </nav>

    <!-- Script -->
    <script>
        let coins = parseInt(localStorage.getItem('sohel_coins')) || 1250;
        updateUI();

        function updateUI() {
            document.getElementById('coin-count').innerText = coins;
            document.getElementById('profile-coins').innerText = coins;
            localStorage.setItem('sohel_coins', coins);
        }

        function claimBonus() {
            coins += 50;
            updateUI();
            alert('Success! +50 Coins added.');
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-indigo-400');
                el.classList.add('text-gray-400');
            });
            btn.classList.remove('text-gray-400');
            btn.classList.add('text-indigo-400');
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const box = document.getElementById('chat-messages');
            const txt = input.value.trim();
            if(!txt) return;

            box.innerHTML += `<div class="bg-indigo-950/40 p-2 rounded border border-indigo-900/50 ml-auto max-w-[85%] text-right"><p class="text-indigo-300 font-bold">You</p><p>${txt}</p></div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            setTimeout(() => {
                box.innerHTML += `<div class="bg-gray-900 p-2 rounded border border-gray-800 max-w-[85%]"><p class="text-indigo-400 font-bold">Sohel AI</p><p class="text-gray-300">I processed your message: "${txt}". Everything is working fine!</p></div>`;
                box.scrollTop = box.scrollHeight;
            }, 500);
        }

        function runTool(type) {
            const outBox = document.getElementById('tool-output');
            const resText = document.getElementById('tool-result-text');
            outBox.classList.remove('hidden');
            if(type === 'text') {
                resText.innerText = "Summary Generated: The application is running smoothly with active local states.";
            } else {
                resText.innerText = "Snippet ready: <div class='p-2 bg-gray-900'>Clean Code Active</div>";
            }
        }

        function resetAccount() {
            if(confirm('Reset all saved data?')) {
                localStorage.clear();
                coins = 1250;
                updateUI();
                alert('Reset complete.');
            }
        }
    </script>
</body>
</html>
